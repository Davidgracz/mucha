name: Smoke test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "scipy>=1.13,<2" "aiohttp>=3.12,<4"

      - name: Compile
        run: |
          python -m py_compile mucha/*.py tests/smoke_test.py

      - name: Smoke test
        run: |
          python tests/smoke_test.py
